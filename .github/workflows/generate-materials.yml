name: Generate materials

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "scripts/generate_materials.py"
      - ".github/workflows/generate-materials.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate materials.js
        run: python3 scripts/generate_materials.py

      - name: Commit generated materials.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials.js
          if git diff --cached --quiet; then
            echo "No changes to materials.js"
          else
            git commit -m "Auto-generate materials.js"
            git push
          fi
