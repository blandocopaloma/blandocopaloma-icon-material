<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BlandocoPaloma アイコン素材集</title>
  <meta name="description" content="さまざまな用途に使えるアイコン素材を配布しています。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="./">
        <span class="brand-mark">✦</span>
        <span>
          <strong>BlandocoPaloma</strong>
          <small>ICON MATERIAL</small>
        </span>
      </a>
      <button class="menu-button" id="menuButton" aria-label="メニュー">☰</button>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <p class="eyebrow">FREE 創作 MATERIAL</p>
      <h1>創作素材集</h1>
      <p class="hero-text">セッションやシナリオ制作に使える<br>アイコン素材を配布しています。</p>
    </section>

    <section class="toolbar">
      <label class="search">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="素材を検索…">
      </label>
      <button class="filter-button active" data-category="all">すべて</button>
      <div id="categoryButtons" class="category-buttons"></div>
    </section>

    <section class="content">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-title">ジャンル</div>
        <button class="side-link active" data-category="all">すべて</button>
        <div id="sidebarCategories"></div>
      </aside>

      <div class="results">
        <div class="results-head">
          <div>
            <p class="eyebrow">MATERIALS</p>
            <h2 id="resultTitle">すべての素材</h2>
          </div>
          <span id="resultCount" class="count"></span>
        </div>
        <div id="materialGrid" class="material-grid"></div>
        <div id="emptyState" class="empty" hidden>
          <div class="empty-icon">?</div>
          <h3>素材が見つかりません</h3>
          <p>検索語やジャンルを変えてみてください。</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap footer-inner">
      <div>
        <strong>BlandocoPaloma アイコン素材集</strong>
        <p>創作や動画、ゲーム、資料など、さまざまな用途に使える素材を少しずつ追加しています。</p>
      </div>
      <div class="footer-links">
        <a href="terms.html">利用規約</a>
        <a href="about.html">このサイトについて</a>
      </div>
    </div>
  </footer>

  <script src="materials.js"></script>
  <script src="app.js"></script>
</body>
</html>
